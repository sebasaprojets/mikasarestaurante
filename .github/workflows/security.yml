name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # semanal (segunda, 06:17 UTC)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Audit · lint · testes · build · e2e de segurança
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # Bloqueia vulnerabilidade alta/crítica em dependências de PRODUÇÃO.
      - run: npm audit --omit=dev --audit-level=high
      # Dev deps: só relatório (ver docs/SECURITY.md → riscos aceitos).
      - run: npm audit --audit-level=critical || true
      - run: npm run lint
      - run: npm run test:security
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npm run test:security:e2e
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: >-
          semgrep scan --error --metrics=off
          --config p/javascript --config p/typescript --config p/react --config p/nextjs --config p/secrets
          --exclude node_modules --exclude .next --exclude out --exclude public

  gitleaks:
    name: Segredos no histórico (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v4
        # Exige "Dependency graph" ligado (Settings → Code security). Até lá, não bloqueia o PR.
        continue-on-error: true
        with:
          fail-on-severity: high
          fail-on-scopes: runtime
